name: Semantic QA — Cooking Anime 162 x 6

on:
  pull_request:
    branches: [main]
    paths:
      - 'authoring/recipes/**'
      - 'tool/semantic_qa_adapter.py'
      - 'tool/tests/test_semantic_qa_adapter.py'
      - 'tool/fast_track_recipe_inventory.py'
      - 'tool/tests/test_fast_track_inventory_lexical.py'
      - '.github/workflows/semantic-qa.yml'
  push:
    branches: [main]
    paths:
      - 'authoring/recipes/**'
      - 'tool/semantic_qa_adapter.py'
      - 'tool/tests/test_semantic_qa_adapter.py'
      - 'tool/fast_track_recipe_inventory.py'
      - 'tool/tests/test_fast_track_inventory_lexical.py'
      - '.github/workflows/semantic-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cooking-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test adapter and its exact canonical source scope
        run: |
          python3 -m unittest discover -s tool/tests -p 'test_semantic_qa_adapter.py' -v
          python3 -m unittest discover -s tool/tests -p 'test_fast_track_inventory_lexical.py' -v
      - name: Pin and retrieve central App Factory engine
        env:
          CORE_SHA: d90c274cd33a9e727e070aa9fa45a506c2ae13c5
        run: |
          mkdir -p build/semantic_qa
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/riccardopinato/App-Factory-Core/$CORE_SHA/reference_engines/semantic_qa/semantic_qa.py" \
            -o build/semantic_qa/semantic_qa.py
          python3 -m py_compile build/semantic_qa/semantic_qa.py
      - name: Restore fingerprint cache (same git ref only)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .semantic-qa-cache/cooking.json
          key: semantic-cooking-v1-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            semantic-cooking-v1-${{ github.ref_name }}-
      - name: Export all 162 IT originals and five locale translations
        run: python3 tool/semantic_qa_adapter.py --output build/semantic_qa/input.json
      - name: Free offline structural audit (no API credentials or provider)
        run: |
          set -euo pipefail
          python3 build/semantic_qa/semantic_qa.py \
            --input build/semantic_qa/input.json \
            --report build/semantic_qa/report.json \
            --cache .semantic-qa-cache/cooking.json \
            --workers 4 --batch-size 100 --provider offline
          python3 tool/semantic_qa_adapter.py --verify-report build/semantic_qa/report.json
      - name: Language Engine v1.1.2 — offline memory, numeric hints and source-bound QA
        env:
          LANGUAGE_SHA: 9391419c6b7c9c23c2f978262fe8fe6670c68160
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/riccardopinato/App-Factory-Core/$LANGUAGE_SHA/reference_engines/language_engine/language_engine.py" \
            -o build/semantic_qa/language_engine.py
          python3 -m py_compile build/semantic_qa/language_engine.py
          python3 build/semantic_qa/language_engine.py \
            --input build/semantic_qa/input.json \
            --semantic-report build/semantic_qa/report.json \
            --report build/semantic_qa/language_report.json --batch-size 100
      - name: Cross-check exact input fingerprint and non-certification
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("build/semantic_qa")
          semantic = json.loads((folder / "report.json").read_text(encoding="utf-8"))
          language = json.loads((folder / "language_report.json").read_text(encoding="utf-8"))
          assert semantic["inputFingerprint"] == language["inputFingerprint"]
          assert semantic["comparisonCount"] == language["comparisons"] == 810
          assert semantic["recordCount"] == language["sourceRecords"] == 162
          assert semantic["certification"] == language["certification"] == "NOT_CERTIFIED"
          assert language["providerCalls"] == 0 and not language["publicationAuthorized"]
          print(json.dumps({
              "sourceBound": True, "compared": 810,
              "translationPairsToReview": language["states"],
              "safeNumberFormHints": language["numericFormNormalizationHints"],
              "certification": "NOT_CERTIFIED",
          }, ensure_ascii=False))
          PY
      - name: Re-audit 162 x 6 runtime catalog and UI localization keys
        run: |
          python3 tool/full_catalog_qa.py --report build/semantic_qa/full_catalog_qa.json
      - name: Inventory 112 legacy recipes for visible editorial gaps (zero API calls)
        run: |
          python3 tool/fast_track_recipe_inventory.py --output build/semantic_qa/cooking_inventory.json
          python3 - <<'PY'
          import json
          report = json.load(open("build/semantic_qa/cooking_inventory.json", encoding="utf-8"))
          assert report["scope"]["recipes"] == 112
          assert report["status"] == "TRIAGE_ONLY_NO_EDITORIAL_CERTIFICATION"
          print(json.dumps({"recipes": 112, "needsReview": report["needs_ai_review"],
                            "candidatesNotCertified": report["contextual_review_candidates"],
                            "issueCounts": report["issue_counts"]}))
          PY
      - name: Preserve inspectable report without publishing source changes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooking-semantic-qa-report
          path: |
            build/semantic_qa/report.json
            build/semantic_qa/cooking_inventory.json
            build/semantic_qa/language_report.json
            build/semantic_qa/full_catalog_qa.json
          if-no-files-found: ignore
          retention-days: 14
