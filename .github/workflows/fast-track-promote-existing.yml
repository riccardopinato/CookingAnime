name: Fast Track source-locked existing recipes

on:
  push:
    branches:
      - feat/fast-track-reviewed-four-20261119
    paths:
      - 'tool/fast_track_promote_existing.py'
      - '.github/workflows/fast-track-promote-existing.yml'

permissions:
  contents: write

concurrency:
  group: fast-track-cooking-existing-recipes
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/fast-track-reviewed-four-20261119
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile 112, mark 16 specific HOLD, materialize 4 additional
        run: |
          python3 tool/fast_track_promote_existing.py --check > /tmp/fast-track-plan.json
          python3 tool/fast_track_promote_existing.py --apply > /tmp/fast-track-applied.json
          python3 tool/compile_recipe_catalog.py
          python3 tool/compile_recipe_catalog.py --check
          python3 tool/validate_recipe_catalog.py
          python3 -m unittest discover -s tool/tests -p 'test_f3l_translation_gate.py'
      - name: Commit exactly generated authoring, catalog and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authoring/recipes assets/catalog docs/f3l_editorial/FAST_TRACK_PROMOTION_2026-11-19.json
          if ! git diff --cached --quiet; then
            git commit -m "content(recipes): integrate additional source-locked six-locale detailed methods"
            git push origin HEAD:refs/heads/feat/fast-track-reviewed-four-20261119
          fi
