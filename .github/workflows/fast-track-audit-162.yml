name: Fast Track — 162 x 6 canonical review queue

on:
  pull_request:
    branches: [main]
    paths:
      - 'authoring/recipes/**'
      - 'assets/catalog/**'
      - 'tool/fast_track_162_queue.py'
      - 'tool/full_catalog_qa.py'
      - 'tool/semantic_qa_adapter.py'
      - 'tool/fast_track_recipe_inventory.py'
      - 'tool/tests/test_fast_track_162_queue.py'
      - '.github/workflows/fast-track-audit-162.yml'
  push:
    branches: [main]
    paths:
      - 'authoring/recipes/**'
      - 'assets/catalog/**'
      - 'tool/fast_track_162_queue.py'
      - 'tool/full_catalog_qa.py'
      - 'tool/semantic_qa_adapter.py'
      - 'tool/fast_track_recipe_inventory.py'
      - '.github/workflows/fast-track-audit-162.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cooking-fasttrack-162-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source (no write credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify deterministic work-lane regression tests
        run: python3 -m unittest discover -s tool/tests -p 'test_fast_track_162_queue.py' -v

      - name: Generate the full 162 x 6 read-only inventory
        run: |
          set -euo pipefail
          mkdir -p build/fast_track
          python3 tool/full_catalog_qa.py --report build/fast_track/full_catalog_qa.json
          python3 tool/fast_track_recipe_inventory.py --output build/fast_track/inventory.json
          python3 tool/fast_track_162_queue.py --output build/fast_track/queue.json --batch-size 100

      - name: Verify 100 + 62 disjoint lanes and provenance (no semantic PASS claim)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/fast_track/queue.json')
          q=json.loads(p.read_text(encoding='utf-8'))
          assert q['countCanonicalIds']==162
          assert q['totalLocaleRecordsExpected']==972
          assert q['structurallyInspectedTranslationPairs']==810
          assert q['mode']=='OFFLINE_STRUCTURAL_TRIAGE_ONLY'
          assert q['semanticallyReviewedByAI']==0
          assert q['semanticallyCertifiedPairs']==0
          assert q['semanticCertification']=='NOT_CERTIFIED'
          b=q['batches']
          assert [x['count'] for x in b]==[100,62]
          ids=[rid for x in b for rid in x['ids']]
          assert len(ids)==len(set(ids))==162
          assert len(q['recipes'])==162
          print('FASTTRACK_162_6_PROVENANCE_PASS',len(ids),q['structuralStatusCounts'])
          PY

      - name: Preserve inspectable reports, not a fictional certification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooking-fast-track-162-source-${{ github.sha }}
          path: build/fast_track/*.json
          if-no-files-found: warn
          retention-days: 14
