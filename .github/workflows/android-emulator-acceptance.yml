name: Cooking Anime — Android emulator acceptance smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/catalog/**'
      - 'authoring/recipes/**'
      - 'test/**'
      - '.github/workflows/android-emulator-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build a separate x86-64 debug APK for emulator only
        run: |
          ./tool/bootstrap_platforms.sh
          flutter pub get
          flutter build apk --debug --target-platform android-x64
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual emulator install, launch, relaunch and screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: bash tool/android_emulator_acceptance.sh
      - name: Preserve actual runtime evidence (emulator is not a physical device)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cooking-android-emulator-acceptance
          path: build/emulator-acceptance/
          if-no-files-found: warn
          retention-days: 14
